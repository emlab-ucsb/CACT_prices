name: Update ICE prices

on:
  schedule:
    # 23:30 UTC weekdays — well after ICE settlement (which posts ~21:00 UTC)
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to ice-data-updates branch
        run: |
          git fetch origin ice-data-updates || true
          if git show-ref --verify --quiet refs/remotes/origin/ice-data-updates; then
            git checkout -B ice-data-updates origin/ice-data-updates
          else
            git checkout -B ice-data-updates origin/main
          fi

      - name: Fetch latest ICE prices
        run: bash figure/code/fetch_ice_prices.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- figure/input; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build commit / PR text
        if: steps.diff.outputs.changed == 'true'
        id: msg
        run: |
          may_last=$(tail -1 figure/input/cca_v26_may26_ice.csv | tr -d '"')
          dec_last=$(tail -1 figure/input/cca_v26_dec26_ice.csv | tr -d '"')
          may_date=${may_last%%,*}; may_price=${may_last##*,}
          dec_date=${dec_last%%,*}; dec_price=${dec_last##*,}
          headline="may26 \$${may_price} (${may_date}), dec26 \$${dec_price} (${dec_date})"
          {
            echo "subject=ICE CCA V26: ${headline}"
            echo "pr_title=ICE CCA V26 updates — ${headline}"
            echo "body<<EOF"
            echo "Latest settlement prices:"
            echo ""
            echo "  may26: \$${may_price}  (${may_date})"
            echo "  dec26: \$${dec_price}  (${dec_date})"
            echo ""
            echo "Source: ICE product guide historical API."
            echo "EOF"
            echo "pr_body<<EOF"
            echo "Automated daily updates to the CCA V26 settlement-price CSVs in figure/input/."
            echo ""
            echo "Latest settlement prices:"
            echo ""
            echo "  may26: \$${may_price}  (${may_date})"
            echo "  dec26: \$${dec_price}  (${dec_date})"
            echo ""
            echo "Each new commit on this branch adds the latest row(s); the commit subject carries the values, so PR subscribers/reviewers get them by email."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_SUBJECT: ${{ steps.msg.outputs.subject }}
          COMMIT_BODY: ${{ steps.msg.outputs.body }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figure/input
          git commit -m "$COMMIT_SUBJECT" -m "$COMMIT_BODY"
          git push origin ice-data-updates

      - name: Open PR if one is not already open
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.msg.outputs.pr_title }}
          PR_BODY: ${{ steps.msg.outputs.pr_body }}
        run: |
          open_prs=$(gh pr list --head ice-data-updates --state open --json number --jq 'length')
          if [ "$open_prs" -gt 0 ]; then
            echo "An open PR for ice-data-updates already exists; nothing to do."
            exit 0
          fi
          gh pr create \
            --base main \
            --head ice-data-updates \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
          gh pr edit ice-data-updates --add-reviewer kylemeng,jmwingenroth \
            || echo "::warning::could not add one or more reviewers (must be repo collaborators)"
